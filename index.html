  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

cina','Cocina'],['gatos','Gatos'],['otros','Otros'],['custom','A la medida']];\nconst PALETTE=[\n  ['sala','Sofá 3 plazas',210,90],['sala','Sofá 2 plazas',160,90],['sala','Sofá en L',260,160],['sala','Sillón',85,85],['sala','Mesa de centro',110,60],['sala','Mueble TV',180,45],['sala','Librero',80,30],\n  ['comedor','Mesa 4 personas',120,80],['comedor','Mesa 6 personas',180,90],['comedor','Mesa redonda',100,100],['comedor','Silla',45,50],\n  ['recamara','Cama individual',100,190],['recamara','Cama matrimonial',140,190],['recamara','Cama queen',160,200],['recamara','Cama king',200,200],['recamara','Buró',50,40],['recamara','Cómoda',100,50],['recamara','Ropero',120,60],\n  ['oficina','Escritorio',140,70],['oficina','Escritorio en L',160,140],['oficina','Silla de escritorio',60,60],['oficina','Librero',80,30],['oficina','Sillón de lectura',85,85],['oficina','Archivero',45,60],\n  ['gym','Tapete de hule',200,150],['gym','Tapete de yoga',180,60],['gym','Bicicleta fija',60,120],['gym','Caminadora',80,180],['gym','Banco de pesas',120,50],['gym','Rack de pesas',120,60],\n  ['cocina','Refrigerador',75,70],['cocina','Estufa',76,60],['cocina','Lavadora',60,65],['cocina','Secadora',60,65],['cocina','Alacena',80,40],['cocina','Mesa auxiliar',100,60],\n  ['gatos','Rascador',60,60],['gatos','Torre para gatos',80,60],['gatos','Arenero',55,45],['gatos','Platos de comida y agua',45,30],['gatos','Cama de gato',50,50],['gatos','Base del robot',45,45],\n  ['otros','Planta',40,40],['otros','Bicicleta',180,60],['otros','Zapatera',80,35],['otros','Clóset',120,50]\n];\n\n/* ───── Save file: leer / escribir ───── */\nlet uid=1;\nfunction normalize(d){\n  if(!d||!Array.isArray(d.rooms)||!Array.isArray(d.items)) throw new Error('formato');\n  const num=(v,f)=>Number.isFinite(+v)?+v:f;\n  const op=(o,type)=>({type:['window','door','gap'].includes(type)?type:'door',wall:['top','bottom','left','right'].includes(o.wall)?o.wall:'top',off:Math.max(0,num(o.off,0)),len:Math.max(10,num(o.len,80))});\n  const rooms=d.rooms.map((r,i)=>({\n    id:String(r.id||'r'+i),name:String(r.name||'Cuarto'),kind:['room','hall','patio'].includes(r.kind)?r.kind:'room',\n    x:num(r.x,0),y:num(r.y,0),w:Math.max(50,num(r.w,300)),h:Math.max(50,num(r.h,300)),\n    openings:Array.isArray(r.openings)?r.openings.map(o=>op(o,o.type)):[...(r.windows||[]).map(o=>op(o,'window')),...(r.doors||[]).map(o=>op(o,o.open?'gap':'door'))]\n  }));\n  const items=d.items.map(it=>{\n    const w=Math.max(5,num(it.w,60)),h=Math.max(5,num(it.h,60));\n    let x=num(it.x,0),y=num(it.y,0),a=num(it.a,0);\n    if(!('a' in it)){ const vw=it.r?h:w,vh=it.r?w:h; x+=vw/2; y+=vh/2; a=it.r?90:0; } // formato viejo\n    return {id:'f'+(uid++),cat:String(it.cat||'otros'),name:String(it.name||'Mueble'),w,h,x,y,a:((a%360)+360)%360,own:it.own!==false};\n  });\n  const columns=(d.columns||[]).map(c=>({x:num(c.x,0),y:num(c.y,0),r:Math.max(5,num(c.r,30))}));\n  return {rooms,columns,items};\n}\nfunction serialize(name){\n  return {version:2,name:name||'Nuestro depa',savedAt:new Date().toISOString(),rooms:S.rooms,columns:S.columns,items:S.items.map(({id,...o})=>o)};\n}\nlet S=null;\ntry{ if(localStorage.getItem(LS.base)===hash(ISLAND)) S=normalize(JSON.parse(localStorage.getItem(LS.auto))); }catch(e){ S=null; }\nif(!S) S=normalize(JSON.parse(ISLAND));\nfunction save(){ try{ localStorage.setItem(LS.auto,JSON.stringify(serialize())); localStorage.setItem(LS.base,hash(ISLAND)); }catch(e){} }\n\n/* ───── Estado de interfaz ───── */\nconst ui={mode:'f',sel:null,cat:'sala',panel:null,grid:true,hl:null,custom:{name:'Mueble',w:100,h:50}};\nconst V={x:0,y:0,k:.5};\nconst svg=$('plan'), world=$('world');\nconst findItem=id=>S.items.find(i=>i.id===id), findRoom=id=>S.rooms.find(r=>r.id===id);\nconst selItem=()=>ui.sel&&ui.sel.type==='f'?findItem(ui.sel.id):null;\nconst selRoom=()=>ui.sel&&ui.sel.type==='r'?findRoom(ui.sel.id):null;\n\nlet toastT;\nfunction toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400); }\n\n/* ───── Geometría ───── */\nfunction wg(r,wall){\n  if(wall==='top') return {sx:r.x,sy:r.y,ax:1,ay:0,nx:0,ny:1};\n  if(wall==='bottom') return {sx:r.x,sy:r.y+r.h,ax:1,ay:0,nx:0,ny:-1};\n  if(wall==='left') return {sx:r.x,sy:r.y,ax:0,ay:1,nx:1,ny:0};\n  return {sx:r.x+r.w,sy:r.y,ax:0,ay:1,nx:-1,ny:0};\n}\nfunction bounds(){\n  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;\n  S.rooms.forEach(r=>{x1=Math.min(x1,r.x);y1=Math.min(y1,r.y);x2=Math.max(x2,r.x+r.w);y2=Math.max(y2,r.y+r.h);});\n  if(!isFinite(x1)){x1=0;y1=0;x2=600;y2=600;}\n  return {x:x1,y:y1,w:x2-x1,h:y2-y1};\n}\nconst rad=a=>a*Math.PI/180;\nfunction ext(it){ const c=Math.abs(Math.cos(rad(it.a))),s=Math.abs(Math.sin(rad(it.a))); return {w:it.w*c+it.h*s,h:it.w*s+it.h*c}; }\nfunction poly(it,sh){ const c=Math.cos(rad(it.a)),s=Math.sin(rad(it.a)),w=it.w/2-sh,h=it.h/2-sh; return [[-w,-h],[w,-h],[w,h],[-w,h]].map(([px,py])=>[it.x+px*c-py*s,it.y+px*s+py*c]); }\nfunction sat(A,B){\n  for(const P of [A,B]) for(let i=0;i<4;i++){\n    const [x1,y1]=P[i],[x2,y2]=P[(i+1)%4],nx=y2-y1,ny=x1-x2;\n    let a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;\n    A.forEach(([x,y])=>{const d=x*nx+y*ny;a0=Math.min(a0,d);a1=Math.max(a1,d);});\n    B.forEach(([x,y])=>{const d=x*nx+y*ny;b0=Math.min(b0,d);b1=Math.max(b1,d);});\n    if(a1<=b0||b1<=a0) return false;\n  }\n  return true;\n}\nfunction toLocal(it,p){ const c=Math.cos(rad(it.a)),s=Math.sin(rad(it.a)),dx=p[0]-it.x,dy=p[1]-it.y; return [dx*c+dy*s,-dx*s+dy*c]; }\nfunction segBox(a,b,hw,hh){\n  let t0=0,t1=1;\n  for(let i=0;i<2;i++){\n    const lim=i?hh:hw,d=b[i]-a[i];\n    if(Math.abs(d)<1e-9){ if(Math.abs(a[i])>=lim) return false; }\n    else{ let u=(-lim-a[i])/d,v=(lim-a[i])/d; if(u>v)[u,v]=[v,u]; t0=Math.max(t0,u); t1=Math.min(t1,v); if(t0>=t1) return false; }\n  }\n  return true;\n}\nfunction wallSegs(){\n  const out=[];\n  S.rooms.forEach(r=>['top','bottom','left','right'].forEach(w=>{\n    const g=wg(r,w),L=g.ax?r.w:r.h; let iv=[[0,L]];\n    r.openings.filter(o=>o.wall===w&&o.type==='gap').forEach(o=>{\n      iv=iv.flatMap(([a,b])=>{const res=[]; if(o.off>a)res.push([a,Math.min(b,o.off)]); if(o.off+o.len<b)res.push([Math.max(a,o.off+o.len),b]); return res.filter(([p,q])=>q>p);});\n    });\n    iv.forEach(([a,b])=>out.push([[g.sx+g.ax*a,g.sy+g.ay*a],[g.sx+g.ax*b,g.sy+g.ay*b]]));\n  }));\n  return out;\n}\nconst isFlat=it=>/tapete|alfombra/i.test(it.name);\nfunction roomOf(it){ return S.rooms.find(r=>it.x>=r.x&&it.x<=r.x+r.w&&it.y>=r.y&&it.y<=r.y+r.h); }\nfunction collisions(){\n  const hit=new Set(),segs=wallSegs(),polys=S.items.map(it=>poly(it,1));\n  S.items.forEach((it,i)=>{\n    if(!roomOf(it)) hit.add(it.id);\n    const hw=it.w/2-4,hh=it.h/2-4;\n    if(hw>0&&hh>0&&segs.some(([a,b])=>segBox(toLocal(it,a),toLocal(it,b),hw,hh))) hit.add(it.id);\n    S.columns.forEach(c=>{ const [lx,ly]=toLocal(it,[c.x,c.y]); const dx=lx-clamp(lx,-it.w/2,it.w/2),dy=ly-clamp(ly,-it.h/2,it.h/2); if(Math.hypot(dx,dy)<c.r-2) hit.add(it.id); });\n    if(isFlat(it)) return;\n    for(let j=i+1;j<S.items.length;j++){ if(isFlat(S.items[j])) continue; if(sat(polys[i],polys[j])){ hit.add(it.id); hit.add(S.items[j].id); } }\n  });\n  return hit;\n}\n\n/* ───── Siluetas (vista superior, frente hacia abajo) ───── */\nfunction shape(name,W,H){\n  const n=name.toLowerCase(),x=-W/2,y=-H/2,m=Math.min(W,H);\n  const R=(c,x,y,w,h,r=4)=>`<rect class=\"${c}\" x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"${r}\"/>`;\n  const C=(c,cx,cy,r)=>`<circle class=\"${c}\" cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\"/>`;\n  const L=(x1,y1,x2,y2)=>`<path class=\"d\" d=\"M${x1} ${y1}L${x2} ${y2}\"/>`;\n  const E=(c,rx,ry)=>`<ellipse class=\"${c}\" rx=\"${rx}\" ry=\"${ry}\"/>`;\n  const body=R('b',x,y,W,H,Math.min(8,m/6));\n  if(/ en l/.test(n)){ const d=Math.round(m*.56); return `<path class=\"b\" stroke-linejoin=\"round\" d=\"M${x} ${y}H${-x}V${y+d}H${x+d}V${-y}H${x}Z\"/>`+(/sof/.test(n)?`<path class=\"d\" d=\"M${-x-6} ${y+d*.3}H${x+d*.3}V${-y-6}\"/>`:''); }\n  if(/^silla/.test(n)) return R('b',x,y,W,H,m/4)+R('p',x+W*.08,y,W*.84,H*.2,4);\n  if(/sof|sill[oó]n/.test(n)){ const a=Math.min(16,W*.13),b=H*.26,k=Math.max(1,Math.round((W-2*a)/75)); let s=body+R('p',x,y,W,b)+R('p',x,y+b*.6,a,H-b*.6)+R('p',-x-a,y+b*.6,a,H-b*.6); for(let i=1;i<k;i++){const lx=x+a+(W-2*a)*i/k; s+=L(lx,y+b+3,lx,-y-4);} return s; }\n  if(/cama de gato|rascador|torre/.test(n)) return E('b',W/2,H/2)+E('d',W*.3,H*.3);\n  if(/^cama/.test(n)){ const k=W>=130?2:1,pw=(W-12*(k+1))/k; let s=body; for(let i=0;i<k;i++) s+=R('p',x+12+i*(pw+12),y+10,pw,H*.16,6); return s+L(x+2,y+H*.36,-x-2,y+H*.36); }\n  if(/redonda/.test(n)) return E('b',W/2,H/2)+E('d',W/2-7,H/2-7);\n  if(/planta/.test(n)) return E('b',W/2,H/2)+C('d',-m*.14,-m*.1,m*.16)+C('d',m*.15,-m*.05,m*.14)+C('d',0,m*.17,m*.15);\n  if(/estufa/.test(n)) return body+[[-1,-1],[1,-1],[-1,1],[1,1]].map(([i,j])=>C('d',i*W*.22,j*H*.2,m*.13)).join('');\n  if(/lavadora|secadora/.test(n)) return body+L(x+2,y+H*.2,-x-2,y+H*.2)+C('d',0,H*.1,m*.28);\n  if(/refri/.test(n)) return body+L(x+2,-y-H*.14,-x-2,-y-H*.14);\n  if(/mesa|escritorio/.test(n)) return body+R('d',x+6,y+6,W-12,H-12,3);\n  if(/tapete|alfombra/.test(n)) return R('b rug',x,y,W,H,4)+R('d',x+8,y+8,W-16,H-16,2);\n  if(/arenero/.test(n)) return body+R('p',x+6,y+6,W-12,H-12,6);\n  if(/plato/.test(n)) return body+C('p',-W*.22,0,m*.3)+C('p',W*.22,0,m*.3);\n  if(/robot/.test(n)) return body+C('p',0,0,m*.32);\n  if(/bici/.test(n)) return R('b rug',x,y,W,H,m/3)+(W>=H?L(x+10,0,-x-10,0)+L(-x-W*.2,-H*.32,-x-W*.2,H*.32):L(0,y+10,0,-y-10)+L(-W*.32,y+H*.2,W*.32,y+H*.2));\n  if(/caminadora/.test(n)) return body+R('p',x+W*.12,y+H*.18,W*.76,H*.76,4);\n  if(/librero|ropero|c[oó]moda|alacena|cl[oó]set|zapatera|archivero|mueble|bur[oó]|rack|banco/.test(n)){ const f=Math.min(8,H*.22); return body+L(x+2,-y-f,-x-2,-y-f)+(W>=90?L(0,y+2,0,-y-f):''); }\n  return body;\n}\n\n/* ───── Dibujo del plano ───── */\nlet raf=0;\nfunction draw(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0;drawNow();}); }\nfunction applyView(){ world.setAttribute('transform',`translate(${-V.x*V.k} ${-V.y*V.k}) scale(${V.k})`); if(ui.sel) draw(); }\nfunction drawNow(){\n  const hit=collisions(), b=bounds();\n  let s='';\n  if(ui.grid) s+=`<rect x=\"${Math.floor((b.x-3000)/50)*50}\" y=\"${Math.floor((b.y-3000)/50)*50}\" width=\"${b.w+6000}\" height=\"${b.h+6000}\" fill=\"url(#grid)\" pointer-events=\"none\"/>`;\n  s+='<g filter=\"url(#plate)\">';\n  S.rooms.forEach(r=>{ s+=`<rect x=\"${r.x}\" y=\"${r.y}\" width=\"${r.w}\" height=\"${r.h}\" fill=\"var(--bg)\"/>`; });\n  s+='<\u002Fg>';\n  S.rooms.forEach(r=>{ s+=`<rect x=\"${r.x}\" y=\"${r.y}\" width=\"${r.w}\" height=\"${r.h}\" fill=\"${r.kind==='patio'?'url(#hatch)':'var(--floor)'}\"/>`; });\n  S.rooms.forEach(r=>{ s+=`<rect x=\"${r.x}\" y=\"${r.y}\" width=\"${r.w}\" height=\"${r.h}\" fill=\"none\" stroke=\"var(--wall)\" stroke-width=\"${r.kind==='hall'?6:8}\"/>`; });\n  S.rooms.forEach(r=>r.openings.forEach(o=>{\n    const g=wg(r,o.wall),x1=g.sx+g.ax*o.off,y1=g.sy+g.ay*o.off,x2=x1+g.ax*o.len,y2=y1+g.ay*o.len;\n    if(o.type==='window'){ s+=`<line x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"var(--window)\" stroke-width=\"12\"/><line x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"var(--floor)\" stroke-width=\"3\"/>`; return; }\n    s+=`<line x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"var(--floor)\" stroke-width=\"12\"/>`;\n    if(o.type==='door'){ const lx=x1+g.nx*o.len,ly=y1+g.ny*o.len,sw=((lx-x1)*(y2-y1)-(ly-y1)*(x2-x1))>0?1:0; s+=`<path d=\"M${x1} ${y1}L${lx} ${ly}A${o.len} ${o.len} 0 0 ${sw} ${x2} ${y2}\" fill=\"none\" stroke=\"var(--f-det)\" stroke-width=\"2.5\"/>`; }\n  }));\n  if(ui.hl){ const r=findRoom(ui.hl); if(r) s+=`<rect x=\"${r.x+8}\" y=\"${r.y+8}\" width=\"${r.w-16}\" height=\"${r.h-16}\" rx=\"8\" fill=\"var(--accent)\" fill-opacity=\".08\" stroke=\"var(--accent)\" stroke-width=\"4\" stroke-dasharray=\"14 10\" pointer-events=\"none\"/>`; }\n  S.columns.forEach(c=>{ s+=`<circle cx=\"${c.x}\" cy=\"${c.y}\" r=\"${c.r}\" fill=\"var(--wall)\"><title>Columna<\u002Ftitle><\u002Fcircle>`; });\n  S.rooms.forEach(r=>{\n    const cx=r.x+r.w/2,fs=clamp(r.w/11,13,22),area=(r.w*r.h/10000).toLocaleString('es-MX',{maximumFractionDigits:1});\n    if(r.h>r.w*2.5) s+=`<text class=\"rn\" transform=\"translate(${cx} ${r.y+r.h/2}) rotate(-90)\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"${fs}\">${esc(r.name.toUpperCase())} · ${mt(r.w)} × ${mt(r.h)} m<\u002Ftext>`;\n    else s+=`<text class=\"rn\" x=\"${cx}\" y=\"${r.y+16+fs}\" text-anchor=\"middle\" font-size=\"${fs}\">${esc(r.name.toUpperCase())}<\u002Ftext><text class=\"rd\" x=\"${cx}\" y=\"${r.y+16+fs*1.95}\" text-anchor=\"middle\" font-size=\"${fs*.7}\">${mt(r.w)} × ${mt(r.h)} m · ${area} m²<\u002Ftext>`;\n  });\n  s+=`<g ${ui.mode==='r'?'opacity=\".35\" pointer-events=\"none\"':''}>`;\n  S.items.forEach(it=>{\n    const on=ui.sel&&ui.sel.type==='f'&&ui.sel.id===it.id,e=ext(it);\n    const fs=clamp(Math.min(e.w/(it.name.length*.55),e.h/2.2),8,15),dims=e.h>=fs*2.7&&e.w>=44;\n    const hr=11/V.k,hd=30/V.k;\n    s+=`<g data-type=\"f\" data-id=\"${it.id}\" class=\"it${it.own?'':' buy'}${hit.has(it.id)?' hit':''}${on?' sel':''}\" transform=\"translate(${it.x} ${it.y})\">\n      <g transform=\"rotate(${it.a})\"><g filter=\"url(#fsh)\">${shape(it.name,it.w,it.h)}<\u002Fg>${on?`<line x1=\"0\" y1=\"${-it.h/2}\" x2=\"0\" y2=\"${-it.h/2-hd}\" stroke=\"var(--accent)\" stroke-width=\"${2/V.k}\"/><circle data-type=\"rot\" data-id=\"${it.id}\" cx=\"0\" cy=\"${-it.h/2-hd}\" r=\"${hr}\" fill=\"var(--bg)\" stroke=\"var(--accent)\" stroke-width=\"${3/V.k}\" style=\"cursor:crosshair\"><title>Girar<\u002Ftitle><\u002Fcircle>`:''}<\u002Fg>\n      <text class=\"lbl\" y=\"${dims?-fs*.3:0}\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"${fs}\">${esc(it.name)}<\u002Ftext>\n      ${dims?`<text class mber\" min=\"5\" step=\"5\" value=\"${it.h}\" aria-label=\"Fondo en cm\"><span class=\"x\">cm<\u002Fspan><button class=\"btn pri\" data-act=\"desel\">Listo<\u002Fbutton><\u002Fdiv>\n  <div class=\"row\"><div class=\"seg\"><button data-act=\"own\" data-v=\"1\" aria-pressed=\"${it.own}\">Lo tenemos<\u002Fbutton><button data-act=\"own\" data-v=\"0\" aria-pressed=\"${!it.own}\">Por comprar<\u002Fbutton><\u002Fdiv>\n  <button class=\"btn\" data-act=\"rot\" data-v=\"-15\" aria-label=\"Girar 15 grados a la izquierda\">−15°<\u002Fbutton><span class=\"x\" id=\"sAng\">${Math.round(it.a)}°<\u002Fspan><button class=\"btn\" data-act=\"rot\" data-v=\"15\" aria-label=\"Girar 15 grados a la derecha\">+15°<\u002Fbutton><button class=\"btn\" data-act=\"rot\" data-v=\"90\">Girar 90°<\u002Fbutton>\n  <button class=\"btn\" data-act=\"dup\">Duplicar<\u002Fbutton><button class=\"btn bad\" data-act=\"del\">Eliminar<\u002Fbutton><span class=\"warn\" id=\"sHit\" hidden>Choca con algo<\u002Fspan><\u002Fdiv>`;\n}\n$('selbar').addEventListener('input',e=>{ const it=selItem(); if(!it) return; if(e.target.id==='sName'){ it.name=e.target.value||'Mueble'; draw(); save(); } });\n$('selbar').addEventListener('change',e=>{ const it=selItem(); if(!it) return;\n  if(e.target.id==='sW') it.w=clamp(+e.target.value||it.w,5,1000);\n  if(e.target.id==='sH') it.h=clamp(+e.target.value||it.h,5,1000);\n  draw(); save(); if(ui.panel) renderPanel();\n});\n\n/* ───── Paneles ───── */\nfunction slotInfo(n){ try{ const d=JSON.parse(localStorage.getItem(LS.slot(n))); return d&&Array.isArray(d.items)?d:null; }catch(e){ return null; } }\nconst when=iso=>{ try{ return new Date(iso).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };\nfunction renderPanel(){\n  const p=$('panel'),k=ui.panel;\n  document.body.classList.toggle('has-panel',!!k); p.hidden=!k;\n  document.querySelectorAll('#menu .hb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===k));\n  i eString('es-MX',{maximumFractionDigits:1})} m²<\u002Fspan><\u002Fdiv><div class=\"bar ${pct>40?'hi':''}\"><i style=\"width:${pct}%\"><\u002Fi><\u002Fdiv><span class=\"hint mono\">${pct}% ocupado<\u002Fspan><div class=\"tags\">${tags}<\u002Fdiv><\u002Fdiv>`;\n    });\n  } else if(k==='save'){\n    h=head('Guardado')+`<p class=\"hint\">Tus cambios se guardan solos en este navegador. Los slots son copias que puedes retomar después.<\u002Fp>`;\n    for(let n=1;n<=3;n++){ const d=slotInfo(n);\n      h+=`<div class=\"card\"><div class=\"h\"><b>Slot ${n}<\u002Fb><span>${d?when(d.savedAt):'Vacío'}<\u002Fspan><\u002Fdiv>${d?`<span class=\"hint mono\">${d.items.length} muebles · ${d.items.filter(i=>i.own===false).length} por comprar<\u002Fspan>`:''}<div class=\"rowb\"><button class=\"btn pri\" data-act=\"slot-save\" data-v=\"${n}\" ${d?'data-confirm=\"1\"':''}>${d?'Sobrescribir':'Guardar aquí'}<\u002Fbutton>${d?`<button class=\"btn\" data-act=\"slot-load\" data-v=\"${n}\" data-confirm=\"1\">Cargar<\u002Fbutton>`:''}<\u002Fdiv><\u002Fdiv>`; }\n    h+=`<h3>Archivo<\u002Fh3><p class=\"hint\">Exporta el diseño como archivo .json para compartirlo. Ese archivo se puede pegar en el index.html como nuevo diseño inicial.<\u002Fp><div class=\"rowb\"><button class=\"btn pri\" data-act=\"export\">Exportar JSON<\u002Fbutton><button class=\"btn\" data-act=\"import\">Importar JSON<\u002Fbutton><\u002Fdiv>\n    <h3>Reiniciar<\u002Fh3><div class=\"rowb\"><button class=\"btn bad\" data-act=\"reset\" data-confirm=\"1\">Volver al diseño inicial<\u002Fbutton><\u002Fdiv>`;\n  } else if(k==='set'){\n    h=head('Ajustes')+`<div class=\"card\"><div class=\"h\"><b>Modo construcción<\u002Fb><\u002Fdiv><span class=\"hint\">Mover y redimensionar cuartos, y editar puertas y ventanas.<\u002Fspan><div class=\"rowb\"><div class=\"seg\"><button data-act=\"mode\" data-v=\"f\" aria-pressed=\"${ui.mode==='f'}\">Muebles<\u002Fbutton><button data-act=\"mode\" data-v=\"r\" aria-pressed=\"${ui.mode==='r'}\">Construcción<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"h\"><b>Cuadrícula de 50 cm<\u002Fb><\u002Fdiv><div class=\"rowb\"><div class=\"seg\"><button data-act=\"grid\" data-v=\"1\" aria-pressed=\"${ui.grid}\">Visible<\u002Fbutton><button data-act=\"grid\" data-v=\"\" aria-pressed=\"${!ui.grid}\">Oculta<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"kbd\"><h3>Teclado<\u002Fh3><dl class=\"keys\" style=\"margin-top:8px\"><dt>Flechas<\u002Fdt><dd>Mover 5 cm (con Shift, 1 cm)<\u002Fdd><dt>R<\u002Fdt><dd>Girar 90°<\u002Fdd><dt>Q / E<\u002Fdt><dd>Girar 15°<\u002Fdd><dt>D<\u002Fdt><dd>Duplicar<\u002Fdd><dt>Supr<\u002Fdt><dd>Eliminar<\u002Fdd><dt>Esc<\u002Fdt><dd>Soltar selección<\u002Fdd><dt>Rueda<\u002Fdt><dd>Zoom<\u002Fdd><\u002Fdl><\u002Fdiv>`;\n  } else if(k==='room'){\n    const r=selRoom(); if(!r){ ui.panel=null; return renderPanel(); }\n    const opt=(v,l,c)=>`<option value=\"${v}\" ${v===c?'selected':''}>${l}<\u002Foption>`;\n    h=head('Cuarto')+`<label class=\"lab\">Nombre<input class=\"field\" data-rk=\"name\" value=\"${esc(r.name)}\"><\u002Flabel>\n    <div class=\"g2\"><label>Ancho cm<input class=\"field\" type=\"number\" min=\"50\" step=\"5\" data-rk=\"w\" value=\"${r.w}\"><\u002Flabel><label>Largo cm<input class=\"field\" type=\"number\" min=\"50\" step=\"5\" data-rk=\"h\" value=\"${r.h}\"><\u002Flabel><\u002Fdiv>\n    <label class=\"lab\">Tipo<select class=\"field\" data-rk=\"kind\">${opt('room','Cuarto',r.kind)}${opt('hall','Pasillo',r.kind)}${opt('patio','Patio o terraza',r.kind)}<\u002Fselect><\u002Flabel>\n    <h3>Puertas y ventanas<\u002Fh3>${r.openings.length?`<div class=\"op oph\"><span>Tipo<\u002Fspan><span>Muro<\u002Fspan><span>Desde<\u002Fspan><span>Largo<\u002Fspan><span><\u002Fspan><\u002Fdiv>`:'<p class=\"hint\">Este cuarto no tiene aberturas.<\u002Fp>'}`+\n    r.openings.map((o,i)=>`<div class=\"op\"><select class=\"field\" data-o=\"${i}\" data-k=\"type\">${opt('door','Puerta',o.type)}${opt('window','Ventana',o.type)}${opt('gap','Vano',o.type)}<\u002Fselect><select class=\"field\" data-o=\"${i}\" data-k=\"wall\">${opt('top','Arriba',o.wall)}${opt('bottom','Abajo',o.wall)}${opt('left','Izq.',o.wall)}${opt('right','Der.',o.wall)}<\u002Fselect><input class=\"field num\" type=\"number\" min=\"0\" step=\"5\" data-o=\"${i}\" data-k=\"off\" value=\"${o.off}\" aria-label=\"Distancia desde la esquina\"><input class=\"field num\" type=\"number\" min=\"10\" step=\"5\" data-o=\"${i}\" data-k=\"len\" value=\"${o.len}\" aria-label=\"Largo\"><button class=\"btn bad\" data-act=\"op-del\" data-v=\"${i}\" aria-label=\"Quitar\">×<\u002Fbutton><\u002Fdiv>`).join('')+\n    `<div class=\"rowb\"><button class=\"btn\" data-act=\"op-add\" data-v=\"door\">+ Puerta<\u002Fbutton><button class=\"btn\" data-act=\"op-add\" data-v=\"window\">+ Ventana<\u002Fbutton><button class=\"btn\" data-act=\"op-add\" data-v=\"gap\">+ Vano<\u002Fbutton><\u002Fdiv><p class=\"hint\">\"Desde\" y \"Largo\" van en cm, medidos desde la esquina superior o izquierda del muro. Un vano es un paso abierto sin puerta.<\u002Fp>\n    <h3>Eliminar<\u002Fh3><div class=\"rowb\"><button class=\"btn bad\" data-act=\"room-del\" data-confirm=\"1\">Eliminar cuarto<\u002Fbutton><\u002Fdiv>`;\n  }\n  p.innerHTML=h;\n}\n$('panel').addEventListener('input',e=>{ const r=selRoom(); if(r&&e.target.dataset.rk==='name'){ r.name=e.target.value; draw(); save(); } });\n$('panel').addEventListener('change',e=>{\n  const r=selRoom(),t=e.target; if(!r) return;\n  if(t.dataset.rk==='w') r.w=Math.max(50,+t.value||r.w);\n  else if(t.dataset.rk==='h') r.h=Math.max(50,+t.value||r.h);\n  else if(t.dataset.rk==='kind') r.kind=t.value;\n  else if(t.dataset.o!=null){ const o=r.openings[+t.dataset.o]; if(!o) return; o[t.dataset.k]=/off|len/.test(t.dataset.k)?Math.max(0,+t.value||0):t.value; }\n  else return;\n  clampOps(r); draw(); save(); if(t.dataset.o!=null) renderPanel();\n});\n$('panel').addEventListener('mouseover',e=>{ const c=e.target.closest('[data-room]'),v=c?c.dataset.room:null; if(v!==ui.hl){ ui.hl=v; draw(); } });\n$('panel').addEventListener('mouseleave',()=>{ if(ui.hl){ ui.hl=null; draw(); } });\n\n/* ───── Acciones ───── */\nfunction load(data,msg){ S=normalize(data); ui.sel=null; if(ui.panel==='room') ui.panel=null; save(); renderSel(); renderPanel(); fit(); draw(); toast(msg); }\nfunction rotate(d){ const it=selItem(); if(!it) return; it.a=(((it.a+d)%360)+360)%360; snapItem(it); draw(); save(); }\nfunction dup(){ const it=selItem(); if(!it) return; const c={...it,id:'f'+(uid++),x:it.x+20,y:it.y+20}; S.items.push(c); save(); select({type:'f',id:c.id}); if(ui.panel) renderPanel(); }\nfunction del(){ const it=selItem(); if(!it) return; S.items=S.items.filter(i=>i!==it); save(); select(null); if(ui.panel) renderPanel(); }\nfunction setMode(m){ ui.mode=m; ui.sel=null; if(ui.panel==='room') ui.panel=null; renderSel(); renderHotbar(); renderPanel(); draw(); }\nconst ACT={\n  panel:v=>{ ui.panel=ui.panel===v?null:v; renderPanel(); if(innerWidth>700) fit(); },\n  close:()=>{ if(ui.panel==='room') ui.sel=null; ui.panel=null; renderPanel(); draw(); if(innerWidth>700) fit(); },\n  cat:v=>{ ui.cat=v; renderHotbar(); },\n  zin:()=>{ const r=svg.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1.3); },\n  zout:()=>{ const r=svg.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.3); },\n  fit:()=>fit(),\n  desel:()=>select(null),\n  own:v=>{ const it=selItem(); if(!it) return; it.own=v==='1'; save(); renderSel(); draw(); if(ui.panel) renderPanel(); },\n  rot:v=>rotate(+v), dup, del,\n  goto:v=>{ const it=findItem(v); if(!it) return; if(innerWidth<=700){ ui.panel=null; renderPanel(); } const r=svg.getBoundingClientRect(); V.k=Math.max(V.k,.7); V.x=it.x-r.width/2/V.k; V.y=it.y-r.height*.4/V.k; applyView(); select({type:'f',id:v}); },\n  'buy-own':v=>{ const it=findItem(v); if(!it) return; it.own=true; save(); renderSel(); renderPanel(); draw(); },\n  'slot-save':v=>{ try{ localStorage.setItem(LS.slot(v),JSON.stringify(serialize('Slot '+v))); toast('Partida guardada en el slot '+v); }catch(e){ toast('No se pudo guardar en este navegador'); } renderPanel(); },\n  'slot-load':v=>{ const d=slotInfo(v); if(d) try{ load(d,'Slot '+v+' cargado'); }catch(e){ toast('Ese slot está dañado'); } },\n  export:()=>{ const a=document.createElement('a'),d=new Date(); a.href=URL.createObjectURL(new Blob([JSON.stringify(serialize(),null,2)],{type:'application/json'})); a.download=`depa-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Archivo exportado'); },\n  import:()=>$('file').click(),\n  reset:()=>load(JSON.parse(ISLAND),'Diseño inicial restaurado'),\n  mode:v=>setMode(v||(ui.mode==='r'?'f':'r')),\n  grid:v=>{ ui.grid=!!v; renderPanel(); draw(); },\n  'add-room':v=>{ const r0=svg.getBoundingClientRect(),c=toWorld(r0.left+r0.width/2,r0.top+r0.height*.4),r={id:'r'+Date.now(),name:v==='patio'?'Patio':'Cuarto nuevo',kind:v,x:snap(c.x-150,10),y:snap(c.y-150,10),w:300,h:300,openings:[]}; S.rooms.push(r); save(); select({type:'r',id:r.id}); },\n  'op-add':v=>{ const r=selRoom(); if(!r) return; r.openings.push({type:v,wall:'top',off:20,len:v==='window'?120:80}); clampOps(r); save(); renderPanel(); draw(); },\n  'op-del':v=>{ const r=selRoom(); if(!r) return; r.openings.splice(+v,1); save(); renderPanel(); draw(); },\n  'room-del':()=>{ const r=selRoom(); if(!r) return; S.rooms=S.rooms.filter(x=>x!==r); save(); select(null); }\n};\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('[data-act]'); if(!b||!ACT[b.dataset.act]) return;\n  if(b.dataset.confirm&&b.dataset.armed!=='1'){ b.dataset.armed='1'; const t=b.textContent; b.textContent='¿Seguro? Toca otra vez'; setTimeout(()=>{ if(b.isConnected){ b.dataset.armed=''; b.textContent=t; } },3000); return; }\n  ACT[b.dataset.act](b.dataset.v);\n});\n$('file').addEventListener('change',e=>{\n  const f=e.target.files[0]; if(!f) return;\n  const rd=new FileReader();\n  rd.onload=()=>{ try{ load(JSON.parse(rd.result),'Diseño importado'); }catch(err){ toast('Ese archivo no es un diseño válido'); } };\n  rd.readAsText(f); e.target.value='';\n});\n\n/* ───── Teclado ───── */\ndocument.addEventListener('keydown',e=>{\n  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||e.metaKey||e.ctrlKey) return;\n  if(e.key==='Escape'){ if(ui.sel) select(null); else if(ui.panel){ ui.panel=null; renderPanel(); } return; }\n  const o=selItem()||selRoom(); if(!o) return;\n  const st=e.shiftKey?1:5,k=e.key.toLowerCase(); let used=true;\n  if(k==='arrowleft') o.x-=st; else if(k==='arrowright') o.x+=st; else if(k==='arrowup') o.y-=st; else if(k==='arrowdown') o.y+=st;\n  else if(selItem()&&k==='r'){ rotate(90); return; } else if(selItem()&&k==='q'){ rotate(-15); return; } else if(selItem()&&k==='e'){ rotate(15); return; }\n  else if(selItem()&&k==='d'){ dup(); return; }\n  else if(selItem()&&(k==='delete'||k==='backspace')){ del(); e.preventDefault(); return; }\n  else used=false;\n  if(used){ e.preventDefault(); draw(); save(); }\n});\n\n/* ───── Inicio ───── */\nrenderHotbar(); renderSel(); renderPanel(); fit(); draw();\nif(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);\nsetTimeout(()=>toast('Arrastra muebles desde el inventario hasta el plano'),700);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
